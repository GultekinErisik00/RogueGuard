#!/usr/sbin/nft -f
# VM host'u: lab köprüleri arasında host'un yönlendirme yapmasını engeller; tek yol rg-router.
# "flush ruleset" YOK: Incus'un kendi tablolarını silerdi. Sadece inet rg_host'a dokunulur.
table inet rg_host
delete table inet rg_host
table inet rg_host {
  chain forward {
    type filter hook forward priority -5; policy accept;
    iifname { "br-iot", "br-quar", "br-svc" } drop
    oifname { "br-iot", "br-quar", "br-svc" } drop
  }
}
