# rg-router: /etc/dnsmasq.d/lab.conf — üç lab köprüsü için DHCP ve DNS.
# eth0 (incusbr0) üzerinde dinlenmez; upstream DNS router'ın kendi resolv.conf'undan gelir.
interface=eth1
interface=eth2
interface=eth3
bind-interfaces
log-dhcp
# Router'ın /etc/resolv.conf'u systemd-resolved stub'ına (127.0.0.53) işaret eder;
# gerçek upstream (incusbr0 DNS'i) bu dosyada durur.
resolv-file=/run/systemd/resolve/resolv.conf
dhcp-range=set:iot,10.20.0.100,10.20.0.199,255.255.255.0,12h
dhcp-range=set:quar,10.20.1.100,10.20.1.199,255.255.255.0,1h
dhcp-range=set:svc,10.20.2.100,10.20.2.199,255.255.255.0,12h
# Broker her zaman aynı IP'yi alır (rezervasyon havuz dışında olabilir).
dhcp-host=00:16:3e:20:02:10,10.20.2.10,mqtt-broker
