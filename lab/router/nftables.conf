#!/usr/sbin/nft -f
# rg-router firewall'ı. Onaysız cihaz: sadece DHCP+DNS. rg_approved: broker 1883 + internet.
# rg_block: hiçbir şey (kural "established"tan önce, açık bağlantılar da kesilir).
# Setler router yeniden başlayınca boşalır; RogueGuard router.sync() ile yeniden doldurur.
flush ruleset
table inet rg {
  set rg_approved { type ipv4_addr; }
  set rg_block    { type ipv4_addr; }

  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    iifname "eth1" ip saddr @rg_block counter drop
    ct state established,related accept
    iifname "eth0" accept
    iifname { "eth1", "eth2", "eth3" } udp dport 67 accept
    iifname { "eth1", "eth3" } meta l4proto { tcp, udp } th dport 53 accept
    iifname "eth1" icmp type echo-request accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    iifname "eth1" ip saddr @rg_block counter drop
    ct state established,related accept
    iifname "eth1" ip saddr @rg_approved ip daddr 10.20.2.10 tcp dport 1883 counter accept
    iifname "eth1" ip saddr @rg_approved oifname "eth0" counter accept
  }

  chain postrouting {
    type nat hook postrouting priority 100;
    oifname "eth0" masquerade
  }
}
