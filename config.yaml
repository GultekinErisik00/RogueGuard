# RogueGuard yapılandırması. Lab adresleri CLAUDE.md §3 ile aynı olmalı.
# Gizli bilgiler (GROQ_API_KEY) burada değil, .env içinde durur.

network:
  iot_iface: br-iot
  iot_subnet: 10.20.0.0/24
  iot_gw_ip: 10.20.0.1          # rg-router eth1
  sensor_iot_ip: 10.20.0.2      # host'un br-iot adresi (DHCP havuzu dışında)
  iot_dhcp: [10.20.0.100, 10.20.0.199]
  quar_subnet: 10.20.1.0/24
  quar_gw_ip: 10.20.1.1
  quar_dhcp: [10.20.1.100, 10.20.1.199]
  svc_subnet: 10.20.2.0/24
  svc_gw_ip: 10.20.2.1
  svc_dhcp: [10.20.2.100, 10.20.2.199]
  broker_mac: "00:16:3e:20:02:10"
  broker_ip: 10.20.2.10
  wazuh_ip: 10.160.244.10       # wazuh container (incusbr0)

router:
  container: rg-router
  table: "inet rg"
  approved_set: rg_approved
  block_set: rg_block

database:
  path: data/rogueguard.db      # repo köküne göre; daemon ve dashboard aynı dosyayı kullanır

discovery:
  arp_scan_interval: 30         # saniye: aktif ARP taraması
  arp_record_every: 300         # aynı (mac, ip) ARP kaydı en fazla bu sıklıkla yazılır
  mdns_query_interval: 120      # saniye: br-iot'a mDNS PTR sorgusu
  traffic_window: 60            # saniye: trafik özet penceresi
  mdns_types:
    - _services._dns-sd._udp.local
    - _http._tcp.local
    - _rtsp._tcp.local
    - _ipp._tcp.local
    - _printer._tcp.local
    - _hap._tcp.local

fingerprint:
  similarity_max: 0.6           # meşru cihaz çiftleri bu skorun altında kalmalı (cam-01/cam-02 hariç)
  weights:                      # özellik ağırlıkları (compare.py)
    oui: 1.0
    hostname: 1.0
    opt55: 1.0
    vendor_class: 1.0
    ports: 1.0
    mdns: 1.0
    destinations: 0.5
    interval: 0.5

decision:
  detection_profile: full          # allowlist (MAC) | fingerprint (+DHCP izi) | full (+ARP, tarama, davranış)
  match_min: 0.9                   # envanterdeki kendi kaydına benzerlik bunun altındaysa impersonation
  alert_cooldown: 300              # saniye: aynı (mac, tür) için tekrar alarm yazılmaz

  scan_window: 30                  # saniye: tarama sayım penceresi
  scan_arp_targets: 10             # pencerede bu kadar farklı IP'ye ARP sorgusu → abnormal_scan
  scan_syn_targets: 15             # pencerede bu kadar farklı ip:port'a TCP SYN → abnormal_scan
  behavior_windows: 3              # K: bu kadar ardışık trafik penceresinde sapma → abnormal_behavior
  rate_factor: 3                   # yayın üst sınırı = rate_factor × beklenen + rate_slack
  rate_slack: 5

containment:
  enabled: true                    # false: sadece alarm yaz, karantina/blok uygulama
  quarantine_bridge: br-quar

learn:
  inventory_path: inventory.yaml    # repo köküne göre; .gitignore'da (lab'a özel)

classify:
  llm_base_url: https://api.groq.com/openai/v1
  llm_model: openai/gpt-oss-20b
  cache_path: data/llm_cache.json   # parmak izi hash önbelleği (.gitignore'da)
