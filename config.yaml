# RogueGuard yapılandırması. Lab adresleri CLAUDE.md §3 ile aynı olmalı.
# Gizli bilgiler (GROQ_API_KEY) burada değil, .env içinde durur.

network:
  iot_iface: br-iot
  iot_subnet: 10.20.0.0/24
  iot_gw_ip: 10.20.0.1          # rg-router eth1
  sensor_iot_ip: 10.20.0.2      # host'un br-iot adresi (DHCP havuzu dışında)
  iot_dhcp: [10.20.0.100, 10.20.0.199]
  quar_subnet: 10.20.1.0/24
  quar_gw_ip: 10.20.1.1
  quar_dhcp: [10.20.1.100, 10.20.1.199]
  svc_subnet: 10.20.2.0/24
  svc_gw_ip: 10.20.2.1
  svc_dhcp: [10.20.2.100, 10.20.2.199]
  broker_mac: "00:16:3e:20:02:10"
  broker_ip: 10.20.2.10
  wazuh_ip: null                # Adım 4'te incusbr0 içinden seçilecek

router:
  container: rg-router
  table: "inet rg"
  approved_set: rg_approved
  block_set: rg_block

database:
  path: data/rogueguard.db      # repo köküne göre; daemon ve dashboard aynı dosyayı kullanır

discovery:
  arp_scan_interval: 30         # saniye: aktif ARP taraması
  arp_record_every: 300         # aynı (mac, ip) ARP kaydı en fazla bu sıklıkla yazılır
  mdns_query_interval: 120      # saniye: br-iot'a mDNS PTR sorgusu
  traffic_window: 60            # saniye: trafik özet penceresi
  mdns_types:
    - _services._dns-sd._udp.local
    - _http._tcp.local
    - _rtsp._tcp.local
    - _ipp._tcp.local
    - _printer._tcp.local
    - _hap._tcp.local

fingerprint:
  similarity_max: 0.6           # meşru cihaz çiftleri bu skorun altında kalmalı (cam-01/cam-02 hariç)
  weights:                      # özellik ağırlıkları (compare.py)
    oui: 1.0
    hostname: 1.0
    opt55: 1.0
    vendor_class: 1.0
    ports: 1.0
    mdns: 1.0
    destinations: 0.5
    interval: 0.5

learn:
  inventory_path: inventory.yaml    # repo köküne göre; .gitignore'da (lab'a özel)
